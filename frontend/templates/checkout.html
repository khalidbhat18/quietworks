{% extends 'base.html' %}
{% block title %}LocalShop | Checkout{% endblock %}
{% block content %}
<section class="card checkout-shell">
  <h1>Checkout</h1>
  <p>Shop: <strong>{{ shop.name }}</strong></p>
  <form id="checkout-form">
    <input type="hidden" id="shop_code" value="{{ shop.shop_code }}">
    <label>Full name<input type="text" id="customer_name" required></label>
    <label>Phone number<input type="tel" id="customer_phone" required></label>
    <label>Delivery address<textarea id="delivery_address" required></textarea></label>
    <label>Delivery instructions (optional)<textarea id="delivery_instructions"></textarea></label>
    <div class="payment-box">
      <strong>Payment method:</strong> Cash on Delivery
    </div>
    <div class="cart-summary" id="checkout-summary"></div>
    <button class="button primary wide" type="submit">Place Order</button>
  </form>
</section>

<script>
  const params = new URLSearchParams(window.location.search);
  const rawItems = params.get('items');
  const shopCode = '{{ shop.shop_code }}';
  let cart = [];

  try {
    cart = rawItems ? JSON.parse(decodeURIComponent(rawItems)) : [];
  } catch (e) {
    cart = [];
  }

  function renderSummary() {
    const summary = document.getElementById('checkout-summary');
    if (!cart.length) {
      summary.innerHTML = '<p class="muted">Cart is empty.</p>';
      return;
    }
    const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    summary.innerHTML = cart.map(item => `
      <div class="summary-row">
        <span>${item.name} x ${item.quantity}</span>
        <strong>₹${(item.price * item.quantity).toFixed(2)}</strong>
      </div>
    `).join('') + `<div class="summary-total"><span>Total</span><strong>₹${total.toFixed(2)}</strong></div>`;
  }

  renderSummary();

  document.getElementById('checkout-form').addEventListener('submit', async function(event) {
    event.preventDefault();
    const payload = {
      shop_code: shopCode,
      customer_name: document.getElementById('customer_name').value,
      customer_phone: document.getElementById('customer_phone').value,
      delivery_address: document.getElementById('delivery_address').value,
      delivery_instructions: document.getElementById('delivery_instructions').value,
      items: cart.map(item => ({ product_id: item.id, quantity: item.quantity })),
    };

    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.success) {
      alert(data.message || 'Order failed.');
      return;
    }
    window.location.href = `/order-confirmation?id=${data.order.id}`;
  });
</script>
{% endblock %}
